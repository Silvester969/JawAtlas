name: JawAtlas
options:
  bundleIdPrefix: com.jawatlas
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  JawAtlasCore:
    path: JawAtlasCore
targets:
  JawAtlas:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: App/Seeds/DemoSeries
        type: folder
        buildPhase: resources
      - path: App/Seeds/DemoSeries.roi.json
        buildPhase: resources
    dependencies:
      - package: JawAtlasCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: JawAtlas
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        NSCameraUsageDescription: JawAtlas uses the camera to show the scan life-size on the table in front of you. Nothing is recorded or sent anywhere.
        NSFaceIDUsageDescription: Face ID keeps the scans on this device private to you.
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: ZIP Archive
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.pkware.zip-archive
          - CFBundleTypeName: DICOM Scan Data
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.nema.dicom
              - public.data
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.nema.dicom
            UTTypeDescription: DICOM Scan Slice
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - dcm
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  JawAtlasTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/JawAtlasCoreTests
    dependencies:
      - target: JawAtlas
      - package: JawAtlasCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  JawAtlas:
    build:
      targets:
        JawAtlas: all
        JawAtlasTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JawAtlasTests
