name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/appstore/screenshots/**
      - docs/media/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble site
        run: |
          mkdir -p _site/img
          cp -R site/. _site/
          cp docs/appstore/screenshots/*.png _site/img/
          if [ -d docs/media ]; then cp -R docs/media/. _site/img/; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
